name: CI & Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Unit Test & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: npm test

      - name: Build production static bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiomos-dist
          path: dist/

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: test-and-build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: axiomos-dist
          path: dist/

      - name: Check Cloudflare credentials
        id: cf-creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN atau CLOUDFLARE_ACCOUNT_ID belum diset di GitHub Secrets. Lewati langkah deploy otomatis via GitHub Actions (atau gunakan integrasi Git langsung di Dashboard Cloudflare Pages)."
          fi

      - name: Ensure Cloudflare Pages project exists
        if: steps.cf-creds.outputs.configured == 'true'
        run: |
          npx --yes wrangler@latest pages project create axiomos --production-branch=main || true

      - name: Publish to Cloudflare Pages
        if: steps.cf-creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=axiomos --branch=main
